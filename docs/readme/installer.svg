<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Installer three-step flow">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12285c"/>
      <stop offset="100%" stop-color="#0a1736"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#7f9df0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#071226"/>

  <!-- step 1 -->
  <g transform="translate(40 48)">
    <rect width="360" height="324" rx="18" fill="url(#card)" stroke="#1e3a6e"/>
    <rect x="16" y="16" width="328" height="28" rx="8" fill="#0c1f42"/>
    <circle cx="32" cy="30" r="4" fill="#4d6bfe"/>
    <text x="46" y="35" fill="#eef3ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">DSH Desktop</text>
    <text x="180" y="92" text-anchor="middle" fill="#f2f6ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">选择安装目录</text>
    <text x="180" y="118" text-anchor="middle" fill="#7d97c4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">应用与运行时将安装到所选目录</text>
    <rect x="28" y="150" width="220" height="32" rx="8" fill="#0a1a3a" stroke="#304a78"/>
    <text x="40" y="171" fill="#f2f6ff" font-family="Consolas, Segoe UI, monospace" font-size="12">D:\Program Files\DSH Desktop</text>
    <rect x="256" y="150" width="76" height="32" rx="8" fill="#304a78"/>
    <text x="294" y="171" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">浏览…</text>
    <rect x="232" y="262" width="100" height="36" rx="10" fill="#4d6bfe"/>
    <text x="282" y="285" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">安装</text>
    <text x="28" y="312" fill="#7d97c4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">01  /  选路径</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(460 48)">
    <rect width="360" height="324" rx="18" fill="url(#card)" stroke="#1e3a6e"/>
    <rect x="16" y="16" width="328" height="28" rx="8" fill="#0c1f42"/>
    <circle cx="32" cy="30" r="4" fill="#4d6bfe"/>
    <text x="46" y="35" fill="#eef3ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">DSH Desktop</text>
    <text x="180" y="92" text-anchor="middle" fill="#f2f6ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">正在安装</text>
    <text x="180" y="118" text-anchor="middle" fill="#7d97c4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">按文件数统计，复制封顶 99%</text>
    <rect x="36" y="156" width="288" height="10" rx="5" fill="#1e3a6e"/>
    <rect x="36" y="156" width="196" height="10" rx="5" fill="url(#accent)"/>
    <text x="180" y="206" text-anchor="middle" fill="#f2f6ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">68%</text>
    <text x="180" y="234" text-anchor="middle" fill="#b2d7ee" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">正在写入 runtime…</text>
    <text x="28" y="312" fill="#7d97c4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">02  /  进度</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(880 48)">
    <rect width="360" height="324" rx="18" fill="url(#card)" stroke="#1e3a6e"/>
    <rect x="16" y="16" width="328" height="28" rx="8" fill="#0c1f42"/>
    <circle cx="32" cy="30" r="4" fill="#4d6bfe"/>
    <text x="46" y="35" fill="#eef3ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">DSH Desktop</text>
    <text x="180" y="108" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="40" font-weight="700">✓</text>
    <text x="180" y="156" text-anchor="middle" fill="#f2f6ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">安装完成</text>
    <rect x="118" y="184" width="18" height="18" rx="4" fill="#4d6bfe"/>
    <path d="M122 193 l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="144" y="198" fill="#dbe9ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">启动 DSH Desktop</text>
    <rect x="232" y="262" width="100" height="36" rx="10" fill="#4d6bfe"/>
    <text x="282" y="285" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">完成</text>
    <text x="28" y="312" fill="#7d97c4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">03  /  完成</text>
  </g>
</svg>
